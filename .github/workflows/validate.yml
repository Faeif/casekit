name: Validate CaseKit

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements.txt
      - run: python3 scripts/validate_suite.py
